name: CI/CD #Name of the workflow

on: # Triggers on push or pull request events but only for the main branch
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test: # This job runs on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
      - name: Run tests
        run: python -m pytest
      - name: Build Docker image
        run: docker build -t shayanbhattacharjee/credit-risk-api -f docker/Dockerfile .
      - name: Login to DockerHub
        if: github.event_name=='push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}
      - name: Push Docker image to DockerHub
        if: github.event_name == 'push'
        run: docker push shayanbhattacharjee/credit-risk-api
